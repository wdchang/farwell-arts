<svg xmlns="http://www.w3.org/2000/svg" viewBox="26 18 416 170" role="img" aria-label="Farwell">
  <title>Farwell</title>

  <defs>
    <!-- one five-pointed star, drawn a little lopsided the way a child draws it -->
    <path id="star" d="M 0,-1 L 0.26,-0.33 L 0.95,-0.31 L 0.38,0.12 L 0.60,0.82 L 0,0.40 L -0.60,0.81 L -0.36,0.13 L -0.95,-0.29 L -0.24,-0.32 Z"/>
  </defs>

  <!-- the word, in yellow wax crayon -->
  <g fill="none" stroke="#f0d64b" stroke-width="9" stroke-linecap="round" stroke-linejoin="round">
    <!-- F -->
    <path d="M 41 40 C 36 72, 45 102, 38 139"/>
    <path d="M 39 41 C 60 33, 79 40, 93 33"/>
    <path d="M 38 87 C 54 83, 67 88, 79 83"/>
    <!-- a -->
    <path d="M 149 91 C 131 79, 108 88, 110 111 C 112 133, 137 139, 149 124"/>
    <path d="M 149 87 C 153 106, 146 125, 153 141"/>
    <!-- r -->
    <path d="M 176 92 C 172 111, 179 127, 174 141"/>
    <path d="M 175 98 C 183 87, 197 85, 205 94"/>
    <!-- w -->
    <path d="M 219 89 C 225 112, 231 131, 239 133 C 247 135, 251 116, 253 99 C 257 118, 261 137, 269 137 C 277 137, 283 112, 287 91"/>
    <!-- e -->
    <path d="M 303 117 C 319 112, 335 111, 345 108 C 343 92, 323 85, 311 96 C 297 108, 301 133, 317 139 C 329 143, 341 136, 347 128"/>
    <!-- l l -->
    <path d="M 367 37 C 362 71, 371 105, 365 139"/>
    <path d="M 397 41 C 392 75, 401 107, 395 142"/>
  </g>

  <!-- magenta afterthoughts scribbled over the top -->
  <g fill="none" stroke="#d5228c" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round">
    <!-- a stroke struck through the F, like a currency sign -->
    <path d="M 47 26 C 45 60, 49 92, 46 118"/>
    <!-- a loop trailing off the last l -->
    <path d="M 395 142 C 407 148, 421 141, 424 129 C 426 119, 415 115, 412 124 C 409 134, 421 141, 434 136"/>
  </g>

  <!-- two small faces living inside the letters -->
  <g fill="none" stroke="#d5228c" stroke-width="2.6" stroke-linecap="round">
    <!-- in the bowl of the a -->
    <path d="M 124 104 L 124 108"/>
    <path d="M 137 103 L 137 107"/>
    <path d="M 123 117 C 128 123, 136 122, 139 116"/>
    <!-- in the eye of the e -->
    <path d="M 318 100 L 318 103"/>
    <path d="M 329 100 L 329 103"/>
    <path d="M 318 108 C 322 112, 328 111, 331 106"/>
  </g>

  <!-- the chain of stars beneath -->
  <g>
    <use href="#star" transform="translate(58,166) rotate(-12) scale(8.5)"  fill="#7b3fa0"/>
    <use href="#star" transform="translate(84,171) rotate(8)   scale(7.4)"  fill="#3f8fc4"/>
    <use href="#star" transform="translate(109,165) rotate(-6)  scale(8.8)" fill="#4a9b4a"/>
    <use href="#star" transform="translate(134,170) rotate(15)  scale(7.2)" fill="#d5228c"/>
    <use href="#star" transform="translate(158,164) rotate(-14) scale(8.6)" fill="#d0342c"/>
    <use href="#star" transform="translate(183,170) rotate(4)   scale(7.6)" fill="#7b3fa0"/>
    <use href="#star" transform="translate(207,165) rotate(-9)  scale(8.4)" fill="#e8a020"/>
    <use href="#star" transform="translate(232,171) rotate(12)  scale(7.1)" fill="#2f9e9e"/>
    <use href="#star" transform="translate(256,164) rotate(-4)  scale(8.7)" fill="#d0342c"/>
    <use href="#star" transform="translate(281,170) rotate(10)  scale(7.5)" fill="#4a9b4a"/>
    <use href="#star" transform="translate(305,165) rotate(-11) scale(8.3)" fill="#d5228c"/>
    <use href="#star" transform="translate(329,171) rotate(6)   scale(7.0)" fill="#7b3fa0"/>
  </g>

</svg>
